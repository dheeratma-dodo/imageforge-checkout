<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Payment successful</title>
<style>
  :root { --bg: #0b0c10; --panel: #161821; --text: #f2f3f7; --text-dim: #9a9db0; --accent: #7c5cff; --accent-2: #29d3c2; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100vh; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 80px 24px; text-align: center; }
  .plan { background: linear-gradient(180deg, rgba(124, 92, 255, 0.08), var(--panel) 45%); border: 1px solid var(--accent); border-radius: 16px; padding: 40px 30px; }
  h1 { margin: 0 0 12px; font-size: 28px; }
  p { color: var(--text-dim); margin: 0 0 24px; }
  a.cta { display: inline-block; padding: 14px 24px; border-radius: 10px; font-weight: 700; background: linear-gradient(135deg, var(--accent), #9b7bff); color: #fff; text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <section class="plan">
      <h1>Payment successful</h1>
      <p>Thank you for subscribing. Check your email for confirmation.</p>
      <a class="cta" href="/">Return home</a>
    </section>
  </div>
</body>
</html>
